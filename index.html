<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Haprocard Projects</title>


    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 32px;
        }


        #projects {
            max-width: 1100px;
            margin: 0 auto;

            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 24px;

        }

        /* ====================================
Project Card
==================================== */

        .project-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.06);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }

        .project-card {
            transform: translateY(-6px);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.10);

        }

        /* ====================================
Project Image
==================================== */

        .project-image {
            width: 100%;
            height: 190px;

            object-fit: cover;

            display: block;

        }

        /* ====================================
Project Content
==================================== */

        .project-content {
            padding: 22px;
        }

        .project-content h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .project-content p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* ====================================
Links
==================================== */

        .project-links {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .project-links a {
            display: inline-block;

            padding: 10px 16px;

            border-radius: 8px;

            background: #111827;
            color: #ffffff;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: opacity 0.2s ease;

        }

        .project-links a {
            opacity: 0.8;
        }

        /* ====================================
Mobile
==================================== */

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 26px;
                margin-bottom: 25px;
            }

            #projects {
                grid-template-columns: 1fr;
            }

            .project-image {
                height: 180px;
            }

        }
    </style>

</head>

<body>




    

    <h1>Haprocard Projects</h1>

    <!-- Projects will appear here -->
    <div id="projects">
        Loading projects...
    </div>

    <script src="assets/js/api.js"></script>

</body>

</html>
